<!-- Instant Redirect to index.html (Recommended)
This is the simplest and most effective for GitHub Pages SPA deployment. -->


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="refresh" content="0;url=<%= BASE_URL %>">
  <title>404 - Redirecting</title>
</head>
<body>
  <script>
    // Fallback redirect if meta refresh fails
    window.location.href = '<%= BASE_URL %>';
  </script>
</body>
</html>
